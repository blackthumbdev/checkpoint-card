<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Checkpoint Project - Card Proof</title>
<style>
  :root{--green:#1b4332;--ink:#464643;--tan:#e4d1b1;--page:#f5efe3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
  main{max-width:960px;margin:0 auto;padding:32px 16px 48px}
  h1{color:var(--green);font-weight:normal;font-size:1.7rem;margin:0 0 .25rem;text-align:center}
  .sub{text-align:center;margin:0 auto 2rem;max-width:34rem}
  h2{color:var(--green);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin:2rem 0 .75rem;font-weight:normal}
  .spread{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  figure{margin:0}
  figure img{display:block;width:100%;height:auto;border:1px solid rgba(27,67,50,.25);box-shadow:0 2px 8px rgba(0,0,0,.12);background:var(--tan)}
  figcaption{text-align:center;font-size:.85rem;margin-top:.4rem}
  .note{text-align:center;font-size:.9rem;margin-top:2rem}
  @media (max-width:560px){.spread{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>The Checkpoint Project</h1>
  <p class="sub">A proof of the printed card. Your message will appear on the inside left page.</p>

  <h2>Outside</h2>
  <div class="spread">
    <figure><img src="images/back.jpg" alt="Back of the card"><figcaption>Back</figcaption></figure>
    <figure><img src="images/front.jpg" alt="Front of the card, with the mountain climber"><figcaption>Front</figcaption></figure>
  </div>

  <h2>Inside</h2>
  <div class="spread">
    <figure><img src="images/inside-left.jpg" alt="Inside left page: Your message to your senior goes here."><figcaption>Inside left - your message</figcaption></figure>
    <figure><img src="images/inside-right.jpg" alt="Inside right page with the shared message from the Class of 2027 Parents and Teachers"><figcaption>Inside right</figcaption></figure>
  </div>

  <p class="note">The printed card is 4.25 x 5.5 inches when folded.</p>
</main>
</body>
</html>
