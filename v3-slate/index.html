<script>
const ENV=[114, 103, 102]; const W=520,H=397,EX=260,ET=225,FH=246,NOTCH=0.50;
const CW=440,CH=569;
const sh=(c,f)=>'rgb('+c.map(x=>Math.max(0,Math.min(255,Math.round(x*f)))).join(',')+')';
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
// build envelope vector parts
$('envBack').style.cssText+=`left:${EX}px;top:${ET}px;filter:drop-shadow(0 8px 14px rgba(60,50,30,.30))`;
$('envBack').innerHTML=`<rect width="${W}" height="${H}" fill="${sh(ENV,.80)}"/>`;
$('pocket').style.cssText+=`left:${EX}px;top:${ET}px;filter:drop-shadow(0 -1px 2px rgba(0,0,0,.10))`;
$('pocket').innerHTML=`<polygon points="0,0 ${W/2},${H*NOTCH} ${W},0 ${W},${H} 0,${H}" fill="${sh(ENV,1)}"/>
 <polygon points="0,${H} ${W/2},${H*NOTCH+2} 0,${H*.18}" fill="${sh(ENV,.97)}"/>
 <polygon points="${W},${H} ${W/2},${H*NOTCH+2} ${W},${H*.18}" fill="${sh(ENV,.96)}"/>
 <polygon points="0,${H} ${W/2},${H*.62} ${W},${H}" fill="${sh(ENV,1.03)}"/>
 <polyline points="0,0 ${W/2},${H*NOTCH} ${W},0" fill="none" stroke="${sh(ENV,.78)}" stroke-width="2"/>`;
$('flap').style.cssText+=`left:${EX}px;top:${ET}px`;
function flapFill(open){ $('flap').innerHTML=`<polygon points="0,0 ${W},0 ${W/2},${FH}" fill="${open?sh(ENV,.88):sh(ENV,1.04)}" stroke="${sh(ENV,.78)}" stroke-width="2"/>`; }
let flapOpen=null;
const clip=$('cardclip');
const HOLD=4, HT=8.7; let OV=null;
function render(t){ const tl=t<=HT?t:(t<=HT+HOLD?HT:t-HOLD); core(tl,null); }
function core(t,OV){
  // timeline (seconds)
  const sealP=seg(t,1.2,1.9), flapP=ease(seg(t,1.8,2.7));
  const rise=ease(seg(t,2.7,4.1)), out=ease(seg(t,4.1,5.5)), drop=ease(seg(t,4.1,5.3));
  const open=ease(seg(t,7.0,8.7)), close=ease(seg(t,12.2,13.3)), turn=ease(seg(t,13.4,14.9));
  const fadeEnd=OV?0:seg(t,17.0,17.8);
  // envelope drop + fade
  const dy=drop*330, envOp=1-seg(t,4.5,5.4);
  for(const id of ['envBack','pocket']){const e=$(id); e.style.transform=`translateY(${dy}px)`; e.style.opacity=envOp;}
  // flap
  const sy=Math.cos(Math.PI*flapP); const isOpen=sy<0;
  if(flapOpen!==isOpen){flapFill(isOpen);flapOpen=isOpen;}
  const f=$('flap'); f.style.transform=`translateY(${dy}px) scaleY(${Math.abs(sy)<0.02?0.02*(isOpen?-1:1):sy})`; f.style.opacity=envOp;
  f.style.zIndex=isOpen?2:6;
  $('envBack').style.zIndex=1; $('pocket').style.zIndex=4;
  // seal rides on flap apex until it pops
  const sealEl=$('seal'); const apexY=ET+FH-68; const sOp=1-seg(t,1.45,1.95);
  sealEl.style.left=(EX+W/2-68)+'px'; sealEl.style.top=(apexY+dy-18*easeOut(sealP))+'px';
  sealEl.style.transform=`scale(${1+0.22*easeOut(sealP)}) rotate(${-10*easeOut(sealP)}deg)`;
  sealEl.style.opacity=Math.min(sOp,envOp); sealEl.style.zIndex=8; sealEl.style.display=(t>1.99?'none':'block');
  // card position/scale
  const hiddenCY=ET+H*0.55+0.5*CH*0.40+30;           // tucked in the pocket
  let cy,s;
  if(t<4.1){ cy=lerp(hiddenCY,236,rise); s=lerp(0.40,0.48,rise);} else { cy=lerp(236,372,out); s=lerp(0.48,1.0,out);}
  const cx=520+(CW/2)*s*(OV?OV.open:open*(1-close));
  $('cardpos').style.transform=`translate(${cx-CW/2}px,${cy-CH/2+1000}px) scale(${s})`;
  $('cardpos').style.opacity=1;
  clip.style.top='-1000px';
  const cb=(t<4.1+1.4)?(ET+H+dy):1800; clip.style.height=(cb+1000)+'px';
  clip.style.zIndex=(t<4.1)?3:7;
  $('cardclip').style.display=(t<2.6)?'none':'block';
  // card interior states
  const cov=(OV?OV.open:open*(1-close))*180; $('cover').style.transform=`rotateY(${-cov}deg)`;
  $('card3d').style.transform=`rotateY(${(OV?OV.turn:turn)*180}deg)`;
  // whole-scene end fade for looping
  $('stage').style.opacity=1-fadeEnd;
  if(t<0.05) $('stage').style.opacity=1;
}
window.render=render;
// ---- interactive viewer ----
const TOTAL=17.8+HOLD; const T_IA=5.7;
const NAMES=['Front','Inside','Back'];
let view=0, st={open:0,turn:0}, anim=null, mode='intro', start=null, raf=null;
function paint(){ core(T_IA,st); }
function tween(steps,done){ // steps: [{open,turn,dur}] run in order
  if(anim) cancelAnimationFrame(anim); let k=0;
  function run(){ if(k>=steps.length){anim=null;done&&done();return;}
    const sp=steps[k], from={open:st.open,turn:st.turn}, t0=performance.now();
    (function f(now){ const p=ease(clamp((now-t0)/sp.dur)); 
      if('open' in sp) st.open=lerp(from.open,sp.open,p); if('turn' in sp) st.turn=lerp(from.turn,sp.turn,p);
      paint(); if(p<1) anim=requestAnimationFrame(f); else {k++;run();} })(t0);}
  run();
}
function goto(v){
  if(v<0||v>2||v===view) return; const from=view; view=v; label();
  let steps=[];
  if(from===0&&v===1) steps=[{open:1,dur:1100}];
  else if(from===1&&v===0) steps=[{open:0,dur:1000}];
  else if(from===1&&v===2) steps=[{open:0,dur:900},{turn:1,dur:1100}];
  else if(from===2&&v===1) steps=[{turn:0,dur:1100},{open:1,dur:1000}];
  else if(from===0&&v===2) steps=[{turn:1,dur:1200}];
  else if(from===2&&v===0) steps=[{turn:0,dur:1200}];
  tween(steps);
}
function label(){ $('lbl').textContent=NAMES[view]; $('prev').style.display=view===0?'none':''; $('lbl').style.display=view===0?'none':''; $('next').innerHTML=view===0?'Open card &#8250;':'Next &#8250;'; $('next').disabled=view===2; $('next').style.background=view===0?'rgba(245,239,227,.16)':'none'; }
function enterIA(){ mode='ia'; st={open:0,turn:0}; view=0; label(); $('ctl').style.display='flex'; clip.classList.add('ia'); paint(); }
function intro(){ if(anim)cancelAnimationFrame(anim); mode='intro'; start=null; $('ctl').style.display='none'; clip.classList.remove('ia'); view=0; raf=requestAnimationFrame(loop); }
function loop(ts){ if(start===null) start=ts; const t=(ts-start)/1000; if(t>=T_IA){ enterIA(); return;} core(t,null); raf=requestAnimationFrame(loop); }
$('prev').onclick=()=>goto(view-1); $('next').onclick=()=>goto(view+1); $('rp').onclick=intro;
clip.addEventListener('click',()=>{ if(mode==='ia'){ view<2?goto(view+1):goto(0);} });
document.addEventListener('keydown',e=>{ if(mode!=='ia')return; if(e.key==='ArrowRight')goto(view+1); if(e.key==='ArrowLeft')goto(view-1); });
window.render=render;
if(!/export=1/.test(location.search)){ core(0,null); raf=requestAnimationFrame(loop);} else {core(0,null);}
function fit(){const k=Math.min(window.innerWidth/1040,(window.innerHeight)/720,1.4);$('frame').style.transform=`scale(${k})`;}
window.addEventListener('resize',fit);fit();
</script></body></html>
